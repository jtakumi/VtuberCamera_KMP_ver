version: 1
updated: 2026-04-19

exceptions:
  - id: IOS_FACE_TRACKING_NOT_IMPLEMENTED
    category: Intentional platform asymmetry
    status: active
    severity: info
    scope:
      - ios
      - face_tracking
    reason: Android has ML Kit face tracking and shared UI state, while iOS currently clears tracking state and does not run a native face analyzer.
    evidence:
      - README.md: iOS face tracking is documented as not implemented.
      - composeApp/src/androidMain/kotlin/com/example/vtubercamera_kmp_ver/camera/AndroidFaceTrackingAnalyzer.kt
      - composeApp/src/iosMain/kotlin/com/example/vtubercamera_kmp_ver/camera/IOSCameraPreview.kt
    reevaluate_when: iOS adds Vision, ARKit, ML Kit, or another face tracking analyzer.

  - id: PHOTO_CAPTURE_AND_SAVE_PLANNED
    category: Spec ahead of code
    status: inactive
    severity: info
    scope:
      - photo_capture
      - image_save
    reason: Photo capture, video recording, and gallery save are now implemented on Android and iOS, so this exception is no longer active.
    evidence:
      - composeApp/src/androidMain/kotlin/com/example/vtubercamera_kmp_ver/camera/AndroidPhotoOutput.kt
      - composeApp/src/iosMain/kotlin/com/example/vtubercamera_kmp_ver/camera/IOSPhotoLibrary.kt
      - README.md: only deletion of captured photos / videos remains under not implemented features.
    reevaluate_when: Remove this historical note once photo / video deletion ships.

  - id: FLASH_ZOOM_PLANNED
    category: Spec ahead of code
    status: active
    severity: info
    scope:
      - flash
      - zoom
    reason: Flash and zoom are planned camera controls and are not part of the current confirmed implementation.
    evidence:
      - README.md: flash and zoom are listed under not implemented features.
      - docs/KMP_IMPLEMENTATION_SPEC.ja.md: flash and zoom are listed under planned work.
    reevaluate_when: CameraX flash / zoom or AVFoundation torch / zoom controls are added.

  - id: README_AVATAR_RENDERING_SUMMARY
    category: Code ahead of spec
    status: inactive
    severity: info
    scope:
      - avatar_renderer
      - readme_summary
    reason: README now distinguishes Android dynamic avatar integration, iOS render-state bridge integration, and unfinished iOS native mesh rendering, so this exception is no longer active.
    evidence:
      - composeApp/build.gradle.kts: Android Filament and gltfio dependencies.
      - composeApp/src/androidMain/kotlin/com/example/vtubercamera_kmp_ver/avatar/render
      - iosApp/iosApp/AvatarRender/FilamentAvatarView.swift
      - README.md: Android dynamic integration, iOS bridge integration, and remaining iOS native mesh renderer work are listed separately.
    reevaluate_when: Remove this historical note when iOS native mesh rendering ships.

  - id: IOS_PHOTO_LIBRARY_PERMISSION_PLANNED
    category: Spec ahead of code
    status: inactive
    severity: info
    scope:
      - ios
      - image_save
      - permissions
    reason: NSPhotoLibraryAddUsageDescription is present and backed by add-only Photos saving of photos and videos, so this exception is no longer active.
    evidence:
      - iosApp/iosApp/Info.plist: NSCameraUsageDescription, NSMicrophoneUsageDescription, and NSPhotoLibraryAddUsageDescription exist.
      - composeApp/src/iosMain/kotlin/com/example/vtubercamera_kmp_ver/camera/IOSPhotoLibrary.kt: photos and videos are saved to Photos with add-only access.
    reevaluate_when: Remove this historical note once iOS photo / video deletion ships.
