#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072M
kotlin.native.disableCompilerDaemon=true

#Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8
org.gradle.java.installations.auto-download=false
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#App version
# Bump appVersionCode for every distributed build; Android refuses to install an APK
# whose versionCode is lower than the installed one. CI can override both values with
# -PappVersionCode=<n> -PappVersionName=<name>.
appVersionCode=2
appVersionName=1.1.0
